<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TripBoard - Danh Sách Chuyến Bay</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">🗺️ TripBoard Flight</a>
            <div class="ms-auto">
                <a href="admin.html" class="btn btn-light btn-sm fw-bold">Trang Quản Trị ⚙️</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="row g-3 mb-4 p-3 bg-white rounded shadow-sm">
            <div class="col-12 col-md-5">
                <input type="text" id="searchFlight" class="form-control" placeholder="🔍 Tìm kiếm chuyến bay theo tên/mã...">
            </div>
            <div class="col-12 col-md-4">
                <select id="filterCategory" class="form-select">
                    <option value="all">-- Tất cả danh mục/Hãng --</option>
                    <option value="Vietnam Airlines">Vietnam Airlines</option>
                    <option value="VietJet Air">VietJet Air</option>
                    <option value="Bamboo Airways">Bamboo Airways</option>
                </select>
            </div>
            <div class="col-12 col-md-3">
                <button id="btnToggleSplit" class="btn btn-outline-secondary w-100">💰 Chia tiền nhanh</button>
            </div>
        </div>

        <div id="splitSection" class="card p-4 shadow-sm mb-4" style="display: none;">
            <h5 class="card-title text-primary fw-bold mb-3">💰 Tính toán chi phí nhóm</h5>
            <div class="row g-3 align-items-center">
                <div class="col-12 col-md-4">
                    <input type="number" id="inputTotalAmount" class="form-control" placeholder="Tổng tiền vé (VND)">
                </div>
                <div class="col-12 col-md-4">
                    <input type="number" id="inputPeople" class="form-control" placeholder="Số thành viên">
                </div>
                <div class="col-12 col-md-4">
                    <button id="btnCalculate" class="btn btn-success w-100">Tính toán</button>
                </div>
            </div>
            <h4 class="mt-3 text-success fw-bold" id="splitResult"></h4>
        </div>

        <div id="loadingSpinner" class="text-center my-5">
            <div class="spinner-border text-primary" role="status"></div>
            <p class="text-muted mt-2">Đang tải danh sách chuyến bay...</p>
        </div>
        <div id="errorMessage" class="alert alert-danger d-none" role="alert"></div>

        <div class="row g-4" id="flightContainer"></div>
    </div>

    <div class="modal fade" id="detailModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title fw-bold" id="detailTitle">Chi tiết chuyến bay</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-toggle="modal" data-bs-target="#detailModal"></button>
                </div>
                <div class="modal-body text-center" id="detailBody">
                    </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/main.js"></script>
    
</body>
</html>
